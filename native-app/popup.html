<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialog</title>
<style>
:root {
  --dialog-bg: #f6f6f6;
  --dialog-shadow: 0 10px 40px rgba(0,0,0,0.28), 0 2px 12px rgba(0,0,0,0.12);
  --dialog-border: rgba(0,0,0,0.08);
  --title-color: #1d1d1f;
  --desc-color: #6e6e73;
  --input-bg: rgba(255,255,255,0.85);
  --input-border: rgba(0,0,0,0.12);
  --input-text: #1d1d1f;
  --input-placeholder: #8e8e93;
  --divider: rgba(0,0,0,0.12);
  --btn-text: #007aff;
  --btn-cancel-text: #007aff;
  --btn-hover: rgba(0,0,0,0.04);
  --icon-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --dialog-bg: #2c2c2e;
    --dialog-shadow: 0 10px 40px rgba(0,0,0,0.55), 0 2px 12px rgba(0,0,0,0.35);
    --dialog-border: rgba(255,255,255,0.08);
    --title-color: #f5f5f7;
    --desc-color: #98989d;
    --input-bg: rgba(30,30,32,0.8);
    --input-border: rgba(255,255,255,0.12);
    --input-text: #f5f5f7;
    --input-placeholder: #636366;
    --divider: rgba(255,255,255,0.12);
    --btn-text: #0a84ff;
    --btn-cancel-text: #0a84ff;
    --btn-hover: rgba(255,255,255,0.06);
    --icon-shadow: 0 2px 8px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --dialog-bg: #2c2c2e;
  --dialog-shadow: 0 10px 40px rgba(0,0,0,0.55), 0 2px 12px rgba(0,0,0,0.35);
  --dialog-border: rgba(255,255,255,0.08);
  --title-color: #f5f5f7;
  --desc-color: #98989d;
  --input-bg: rgba(30,30,32,0.8);
  --input-border: rgba(255,255,255,0.12);
  --input-text: #f5f5f7;
  --input-placeholder: #636366;
  --divider: rgba(255,255,255,0.12);
  --btn-text: #0a84ff;
  --btn-cancel-text: #0a84ff;
  --btn-hover: rgba(255,255,255,0.06);
  --icon-shadow: 0 2px 8px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: transparent;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.dialog {
  position: relative;
  width: 270px;
  /* A solid window background. backdrop-filter was the real cause of the "gray
     box": in a borderless, transparent WKWebView window there is nothing behind
     the page for the filter to sample, so WebKit paints the region a flat gray.
     An opaque fill gives a proper, non-gray dialog window background. */
  background: var(--dialog-bg);
  border-radius: 14px;
  box-shadow: var(--dialog-shadow);
  border: 0.5px solid var(--dialog-border);
  overflow: hidden;
}

.dialog.style-warning { border-color: rgba(255,159,10,0.45); border-width: 1.5px; }
.dialog.style-error { border-color: rgba(255,59,48,0.45); border-width: 1.5px; }

/* Draggable top area so the borderless window can be moved */
.dialog-body {
  padding: 20px 16px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-app-region: drag;
}

/* Keep inputs interactive, not draggable */
.dialog-input { -webkit-app-region: no-drag; }

.dialog-icon {
  width: 56px;
  height: 56px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  background: linear-gradient(180deg, #c8c8cc 0%, #9e9ea3 100%);
  box-shadow: var(--icon-shadow);
  color: #fff;
  flex-shrink: 0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .dialog-icon { background: linear-gradient(180deg, #5a5a5e 0%, #3a3a3c 100%); }
}
:root[data-theme="dark"] .dialog-icon { background: linear-gradient(180deg, #5a5a5e 0%, #3a3a3c 100%); }

.dialog-icon svg { width: 30px; height: 30px; fill: #fff; }

.dialog-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--title-color);
  text-align: center;
  margin-bottom: 4px;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.dialog-desc {
  font-size: 12px;
  font-weight: 400;
  color: var(--desc-color);
  text-align: center;
  line-height: 1.4;
  margin-bottom: 14px;
  max-width: 234px;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.dialog-fields {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dialog-input {
  width: 100%;
  height: 24px;
  border-radius: 5px;
  border: 0.5px solid var(--input-border);
  background: var(--input-bg);
  padding: 0 7px;
  font-size: 12px;
  font-family: inherit;
  color: var(--input-text);
  outline: none;
}

.dialog-input::placeholder { color: var(--input-placeholder); }

.dialog-input:focus {
  border-color: #007aff;
  box-shadow: 0 0 0 2.5px rgba(0,122,255,0.25);
}

.dialog-buttons {
  display: flex;
  width: 100%;
  border-top: 0.5px solid var(--divider);
}

.dialog-btn {
  flex: 1;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-family: inherit;
  letter-spacing: -0.01em;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--btn-cancel-text);
  font-weight: 400;
  transition: background 0.1s ease;
  -webkit-user-select: none;
  user-select: none;
}

.dialog-btn:hover { background: var(--btn-hover); }
.dialog-btn:active { background: rgba(0,122,255,0.08); }
.dialog-btn.primary { font-weight: 600; color: var(--btn-text); }
.dialog-btn-divider { width: 0.5px; background: var(--divider); align-self: stretch; flex-shrink: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function() {
  'use strict';

  var iconSvgs = {
    lock: '<path d="M12 2C9.24 2 7 4.24 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.76-2.24-5-5-5zm-3 5c0-1.66 1.34-3 3-3s3 1.34 3 3v3H9V7zm4 9a1 1 0 1 1-2 0v-3a1 1 0 1 1 2 0v3z"/>',
    key: '<path d="M12.65 10a6 6 0 1 0-1.3 2H15v2h2v-2h1.5v-2h-5.85zM7 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>',
    gear: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.48.48 0 0 0 13.93 2h-3.86c-.24 0-.44.17-.48.4l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.71 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.04.3-.06.63-.06.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.04.24.24.4.48.4h3.86c.24 0 .44-.17.48-.4l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>',
    cloud: '<path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>',
    shield: '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>',
    wifi: '<path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>',
    person: '<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>',
    bell: '<path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>'
  };

  function escAttr(s) {
    s = (s == null) ? '' : String(s);
    return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function closePopup() {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.closePopup) {
        window.webkit.messageHandlers.closePopup.postMessage('close');
      }
    } catch (e) {}
  }

  // OK: collect every input's value keyed by its placeholder/label, send to the
  // app, then let the app close the popup.
  function submitPopup() {
    var values = {};
    try {
      var inputs = document.querySelectorAll('.dialog-input');
      for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        var key = input.getAttribute('placeholder') || input.getAttribute('aria-label') || ('Field ' + (i + 1));
        values[key] = input.value;
      }
    } catch (e) {
      values = {};
    }
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.submitPopup) {
        window.webkit.messageHandlers.submitPopup.postMessage(JSON.stringify({ values: values, ts: Date.now() }));
        return;
      }
    } catch (e) {}
    // No app bridge available: just close.
    closePopup();
  }

  window.renderDialog = function(cfgJsonString) {
    var cfg;
    try {
      cfg = (typeof cfgJsonString === 'string') ? JSON.parse(cfgJsonString) : (cfgJsonString || {});
    } catch (e) {
      cfg = {};
    }

    // Theme
    if (cfg.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else if (cfg.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');

    var dialogClass = 'dialog';
    if (cfg.style === 'warning') dialogClass += ' style-warning';
    if (cfg.style === 'error') dialogClass += ' style-error';

    var fieldsHtml = '';
    if (cfg.twoFields) {
      fieldsHtml += '<input class="dialog-input" type="' + escAttr(cfg.field2Type) + '" placeholder="' + escAttr(cfg.field2Placeholder) + '">';
    }
    fieldsHtml += '<input class="dialog-input" type="' + escAttr(cfg.field1Type) + '" placeholder="' + escAttr(cfg.field1Placeholder) + '">';

    var titleStyle = cfg.titleColor ? ' style="color:' + escAttr(cfg.titleColor) + '"' : '';
    var descStyle = cfg.descColor ? ' style="color:' + escAttr(cfg.descColor) + '"' : '';
    var btnStyle = cfg.btnColor ? ' style="color:' + escAttr(cfg.btnColor) + '"' : '';

    var html = '<div class="' + dialogClass + '">' +
      '<div class="dialog-body">' +
        '<div class="dialog-icon">' +
          '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + (iconSvgs[cfg.icon] || iconSvgs.lock) + '</svg>' +
        '</div>' +
        '<div class="dialog-title"' + titleStyle + '>' + escAttr(cfg.title || 'Title') + '</div>' +
        '<div class="dialog-desc"' + descStyle + '>' + escAttr(cfg.description) + '</div>' +
        '<div class="dialog-fields">' + fieldsHtml + '</div>' +
      '</div>' +
      '<div class="dialog-buttons">' +
        '<button class="dialog-btn" id="popupCancel"' + btnStyle + '>' + escAttr(cfg.btnCancelLabel || 'Cancel') + '</button>' +
        '<div class="dialog-btn-divider"></div>' +
        '<button class="dialog-btn primary" id="popupOk"' + btnStyle + '>' + escAttr(cfg.btnOkLabel || 'OK') + '</button>' +
      '</div>' +
    '</div>';

    document.getElementById('root').innerHTML = html;

    var cancel = document.getElementById('popupCancel');
    var ok = document.getElementById('popupOk');
    if (cancel) cancel.addEventListener('click', closePopup);
    if (ok) ok.addEventListener('click', submitPopup);
  };

  // Native window drag. -webkit-app-region:drag is inert inside a WKWebView, and
  // isMovableByWindowBackground never fires because the web view swallows the
  // mouse events. So on mouse-down over any non-interactive area we ask the app
  // to perform the window drag from the current event.
  document.addEventListener('mousedown', function(e) {
    var t = e.target;
    // Leave clicks on real controls alone so buttons click and inputs focus.
    if (t && t.closest && (t.closest('input') || t.closest('button'))) return;
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dragWindow) {
        window.webkit.messageHandlers.dragWindow.postMessage('drag');
      }
    } catch (err) {}
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closePopup();
    } else if (e.key === 'Enter') {
      submitPopup();
    }
  });
})();
</script>
</body>
</html>
